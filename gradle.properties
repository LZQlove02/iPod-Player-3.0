# 只设堆大小，**不要**在这里加 -Dfile.encoding=UTF-8：
# 守护进程的默认编码决定 Gradle 写「参数文件」（命令行过长时的 @argfile）用哪种编码，
# 而 JVM 读 @argfile 用的是系统本地编码（本机 GBK）。一旦守护进程写成 UTF-8，
# 含中文的路径（本机用户目录 C:\Users\丽泽桥\...、项目路径）在 @argfile 里就会变成乱码，
# 单元测试 worker 直接 ClassNotFoundException: GradleWorkerMain。
# 源码是 Kotlin，编译期统一按 UTF-8 读，不受这里影响。
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

# Gradle 8.14.4 不兼容 Java 25（Android Studio 默认 JBR），指定 JDK 17 编译。
# 原始路径 C:\Users\丽泽桥\.jdks\jbr-17.0.14 含中文，在 gradle.properties 里
# 会被 GBK 编码截断，故创建纯 ASCII junction C:\jdk17 指向同一目录。
org.gradle.java.home=C\:\\jdk17

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 项目路径含中文，必须保留
android.overridePathCheck=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
